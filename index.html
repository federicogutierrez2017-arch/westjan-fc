<!DOCTYPE html>
<html lang="es" data-theme="dark"><head><style>body {transition: opacity ease-in 0.2s; }

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Westjan FC · Superliga 8v8</title>
<style>
/* Paleta tomada del escudo: celeste #6BACE4, blanco, sol #EEB425, negro */
:root{
  color-scheme: dark;
  --plane:#0a0a0b; --surface:#141416; --surface-2:#1d1d20; --surface-3:#26262a;
  --ink:#ffffff; --ink-2:#c6c8cc; --muted:#8b8d93;
  --grid:#26262a; --line:#33343a; --border:rgba(255,255,255,.11);
  --s1:#6bace4; --s2:#d95926; --s3:#199e70; --s4:#eeb425;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#e66767;
  --brand:#6bace4; --gold:#eeb425;
  --accent:#6bace4; --accent-ink:#0a0a0b;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
}
[data-theme="light"]{
  color-scheme: light;
  --plane:#f7f9fb; --surface:#ffffff; --surface-2:#eef3f8; --surface-3:#e2eaf2;
  --ink:#0b0f14; --ink-2:#4a535e; --muted:#7d8792;
  --grid:#e2eaf2; --line:#c3cfda; --border:rgba(11,15,20,.10);
  --s1:#277bc4; --s2:#eb6834; --s3:#1baf7a; --s4:#8a6300;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#006300; --crit:#d03b3b;
  --brand:#277bc4; --gold:#8a6300;
  --accent:#277bc4; --accent-ink:#ffffff;
  --shadow: 0 1px 2px rgba(11,15,20,.06), 0 8px 24px rgba(11,15,20,.08);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
.paychip.club{background:transparent;border:1px dashed var(--line);color:var(--muted);cursor:default;font-weight:600}
.vgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:12px}
.vcard{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);transition:border-color .15s}
.vcard:hover{border-color:var(--accent)}
.vthumb{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vplay{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.vmeta{padding:10px 12px}
.vmeta .vt{font-weight:650;font-size:14px}

html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:60px;
}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.01em}
button{font:inherit; cursor:pointer}
input,select,textarea{font:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header.app{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.crest{
  width:40px;height:40px;flex:none;
  display:grid;place-items:center;font-size:19px;color:#fff;font-weight:800;
}
.crest img{width:100%;height:100%;object-fit:contain;display:block}
.brand{min-width:0;flex:1}
.brand input{
  background:transparent;border:0;color:var(--ink);font-size:17px;font-weight:700;
  padding:0;width:100%;letter-spacing:-.02em;outline:none;
}
.brand input:focus{text-decoration:underline dotted var(--muted)}
.brand .sub{font-size:12px;color:var(--muted)}
.hbtns{display:flex;gap:6px;flex:none}
.iconbtn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;
}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  padding:9px 12px;white-space:nowrap;font-weight:560;font-size:14px;
}
nav.tabs button:hover{color:var(--ink-2)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- generic ---------- */
main{padding-top:18px}
section.tab{display:none}
section.tab.on{display:block}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px;margin-bottom:14px;
}
.card>h2{font-size:14px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;
  padding:8px 14px;font-weight:600;font-size:14px;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.danger{background:transparent;color:var(--crit);border:1px solid var(--border)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:560}
label.f input,label.f select,label.f textarea{
  background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
  padding:7px 9px;color:var(--ink);font-size:14px;outline:none;min-width:0;
}
label.f input:focus,label.f select:focus{border-color:var(--accent)}
.grid{display:grid;gap:10px}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.tile .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.tile .v{font-size:28px;font-weight:680;letter-spacing:-.025em;margin-top:2px;line-height:1.1}
.tile .n{font-size:12px;color:var(--ink-2);margin-top:3px}
.pos{color:var(--good)} .neg{color:var(--crit)}

/* ---------- table ---------- */
.tblwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
td{padding:8px;border-bottom:1px solid var(--grid);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.name{font-weight:600}
.pill{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;
  padding:2px 8px;border-radius:999px;border:1px solid var(--border);
}
.pill.g{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-color:transparent}
.pill.e{background:var(--surface-3);color:var(--ink-2);border-color:transparent}
.pill.p{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit);border-color:transparent}

/* ---------- bar chart ---------- */
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:104px 1fr auto;align-items:center;gap:10px;font-size:13.5px}
.bar .lb{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{background:var(--surface-2);border-radius:4px;height:14px;overflow:hidden}
.bar .fl{height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:3px;transition:width .3s}
.bar .vv{font-variant-numeric:tabular-nums;font-weight:650;min-width:22px;text-align:right}

/* ---------- roster editor ---------- */
.rost{display:grid;gap:6px}
.rhead,.rrow{
  display:grid;
  grid-template-columns:22px minmax(110px,1.4fr) 46px 46px 40px 40px 44px 62px;
  gap:6px;align-items:center;
}
.rhead{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;text-align:center}
.rhead span:nth-child(2){text-align:left}
.rrow{padding:5px 0;border-bottom:1px solid var(--grid)}
.rrow.off{opacity:.4}
.rrow input[type=number]{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;
  padding:5px 4px;text-align:center;color:var(--ink);font-size:13.5px;outline:none;
  -moz-appearance:textfield;
}
.rrow input[type=number]::-webkit-outer-spin-button,.rrow input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rrow input[type=number]:focus{border-color:var(--accent)}
.rrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.rrow .ctr{display:grid;place-items:center}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:17px;height:17px;cursor:pointer}
.paychip{
  border:1px solid var(--border);background:var(--surface-2);color:var(--muted);
  border-radius:7px;padding:4px 0;width:100%;font-size:11.5px;font-weight:650;
}
.paychip.on{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good);border-color:transparent}

/* ---------- break-even meter ---------- */
.meter{margin-top:4px}
.meter .tr{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden;display:flex}
.meter .fl{height:100%;background:var(--s4);transition:width .25s}
.meter .fl.ok{background:var(--good)}
.meter .lg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}

/* ---------- modal ---------- */
.modal{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);
  display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 12px;
}
.modal.on{display:flex}
.sheet{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:720px;padding:18px;box-shadow:var(--shadow);
}
.sheet h2{font-size:18px;margin-bottom:14px}
.sticky-actions{
  position:sticky;bottom:-18px;background:var(--surface);padding:12px 0 0;
  margin-top:14px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;
}

.robar{
  background:color-mix(in srgb,var(--accent) 16%,transparent);
  color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  border-radius:8px; padding:6px 12px; margin-bottom:8px;
  font-size:12px; font-weight:650; letter-spacing:.02em;
}
.robar[hidden]{display:none}
.robar.aviso{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);border-color:transparent}
.fxrow .fxg{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- lista de pagos de inscripción ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:6px;margin-top:12px}
.prow{
  display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:7px 10px;font-size:13.5px;
}
.prow.ok{background:color-mix(in srgb,var(--good) 15%,transparent);border-color:transparent}
.prow.ex{opacity:.45}
.prow label{display:flex;align-items:center;gap:9px;cursor:pointer;min-width:0}
.prow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.ok .nm{color:var(--good)}
.prow .am{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.prow .mini{
  background:none;border:0;color:var(--muted);font-size:10.5px;padding:0 0 0 2px;
  text-decoration:underline;text-underline-offset:2px;white-space:nowrap;
}
.prow .mini:hover{color:var(--ink)}

/* ---------- el barco ---------- */
.barcoHero{
  background:linear-gradient(160deg, color-mix(in srgb,var(--accent) 22%,transparent), transparent 70%);
  border:1px solid var(--border); border-radius:16px; padding:22px; margin-bottom:14px; text-align:center;
}
.barcoHero .obj{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.barcoHero .est{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px;line-height:1.15}
.barcoHero .fra{font-size:14.5px;color:var(--ink-2);max-width:520px;margin:0 auto}
.escala{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:18px 0 6px}
.escala div{height:10px;border-radius:3px;background:var(--surface-3)}
.escala div.ok{background:var(--good)}
.escala div.yo{background:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.escala div.no{background:color-mix(in srgb,var(--crit) 55%,transparent)}
.escalaLbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.chapa{
  display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--grid);font-size:14.5px;
}
.chapa:last-child{border-bottom:0}
.chapa b{font-size:19px;font-variant-numeric:tabular-nums;min-width:52px}

/* ---------- fixture rows ---------- */
.fxrow{
  display:grid;grid-template-columns:1fr 46px 12px 46px 1fr 26px;gap:8px;align-items:center;
  padding:6px 8px;border-radius:9px;font-size:13.5px;
}
.fxrow.mine{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.fxrow .tm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:560}
.fxrow .tm.r{text-align:right}
.fxrow .fxn{font-size:11px;text-align:center}
.fxrow input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;
  padding:5px 2px;text-align:center;color:var(--ink);font-size:14px;outline:none;-moz-appearance:textfield;
}
.fxrow input::-webkit-outer-spin-button,.fxrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fxrow input:focus{border-color:var(--accent)}

/* ---------- posts ---------- */
.postgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){.postgrid{grid-template-columns:300px 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);
  border-radius:999px;padding:6px 12px;font-size:13px;font-weight:560;
}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
#preview{width:100%;height:auto;border-radius:12px;display:block;box-shadow:var(--shadow);background:#000}
.capbox{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:10px;color:var(--ink);font-size:13px;min-height:120px;resize:vertical;outline:none;line-height:1.5;
}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);
  background:var(--ink);color:var(--plane);padding:9px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:100;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
@media(max-width:620px){
  .rhead,.rrow{grid-template-columns:20px minmax(84px,1.3fr) 40px 40px 34px 34px 38px 54px;gap:4px}
  .tile .v{font-size:24px}
}
</style>

      if(fuera.length){
        s.jugadores = s.jugadores.filter(j=>!fuera.includes(j.id));

            pt.asistentes=(pt.asistentes||[]).filter(x=>x!==id);
            delete pt.eventos?.[id]; delete pt.pagos?.[id];
            if(pt.mvp===id) pt.mvp=null;

    }

/* =========================================================
   CÁLCULOS
   ========================================================= */
function ev(p, jid){
  const e = p.eventos?.[jid] || {};
  return { g:+e.g||0, a:+e.a||0, am:+e.am||0, rj:+e.rj||0 };
}
function matchFin(p){
  const cuota = +p.cuota || S.cfg.cuota;
  const cancha = +p.cancha || 0;
  const pres = p.asistentes || [];
  const pagos = p.pagos || {};
  const cobrables = pres.filter(id => !exentoCuota(id));               // los exentos los paga el club
  const devengado = cobrables.length * cuota;
  const cobrado = cobrables.filter(id => pagos[id]).length * cuota;     // efectivo de esa fecha
  const conCredito = cobrables.filter(id => !pagos[id] && cubiertoPorCredito(p.id, id)).length * cuota;
  const cubreClub = (pres.length - cobrables.length) * cuota;
  return {
    cuota, cancha, n:pres.length, nPaga:cobrables.length, conCredito, cubreClub,
    devengado, cobrado, porCobrar: devengado - cobrado - conCredito,
    resultado: devengado - cancha,
    breakeven: cuota>0 ? Math.ceil(cancha/cuota) : 0
  };
}
function abonoDe(id){ return (S.abonos||[]).filter(a=>a.jid===id).reduce((t,a)=>t+(+a.monto||0),0); }
/* Un adelanto cubre automáticamente las cuotas siguientes que no se pagaron en efectivo,
   en orden cronológico. Devuelve, por jugador, qué partidos quedaron cubiertos y el sobrante. */
function credito(id){
  if(exentoCuota(id)) return { cubiertos:new Set(), aFavor:abonoDe(id), total:abonoDe(id) };
  let disp = abonoDe(id);
  const cubiertos = new Set();
  ordenados().forEach(p=>{
    if(!(p.asistentes||[]).includes(id)) return;
    if(p.pagos?.[id]) return;                       // ya lo pagó en efectivo esa fecha
    const c = +p.cuota || S.cfg.cuota;
    if(disp >= c){ disp -= c; cubiertos.add(p.id); }
  });
  return { cubiertos, aFavor: disp, total: abonoDe(id) };
}
function cubiertoPorCredito(pid, jid){ return credito(jid).cubiertos.has(pid); }
function ordenados(){
  return [...S.partidos].sort((a,b)=> (a.fecha||"").localeCompare(b.fecha||"") || (a.id>b.id?1:-1));
}
/* ---- inscripción del torneo, prorrateada entre los jugadores activos ---- */
function activos(){ return S.jugadores.filter(j=>j.activo!==false); }
function exentoInsc(id){ return !!(S.torneo.inscExentos||{})[id]; }
/* Jugadores que no pagan cuota por partido: los cubre el club. */
function exentoCuota(id){ const j=S.jugadores.find(x=>x.id===id); return !!(j&&j.exento); }
function pagoInsc(id){ return !!(S.torneo.inscPagos||{})[id]; }
function participanInsc(){ return activos().filter(j=>!exentoInsc(j.id)); }
function insc(){
  const total = +S.torneo.inscripcion || 0;              // lo que se le pagó al torneo
  const part = participanInsc();                          // a quiénes se les cobra
  const n = part.length;
  const cuota = +S.torneo.inscCuota || (n? total/n : 0);  // cuánto a cada uno
  const pagaron = part.filter(j=>pagoInsc(j.id)).length;
  return { total, n, cuota, pagaron,
           exentos: activos().length - n,
           cobrado: cuota*pagaron,
           porCobrar: cuota*(n-pagaron),
           recaudaTodo: cuota*n,
           egreso: S.torneo.inscPagada!==false ? total : 0 };
}
function fondo(){
  let cobrado=0, cancha=0, gastos=0, ingresos=0, porCobrar=0;
  S.partidos.forEach(p=>{ const f=matchFin(p); cobrado+=f.cobrado; cancha+=f.cancha; porCobrar+=f.porCobrar; });
  S.mov.forEach(m=>{ if(m.tipo==="gasto") gastos+=+m.monto||0; else ingresos+=+m.monto||0; });
  const i = insc();
  const abonos = (S.abonos||[]).reduce((t,a)=>t+(+a.monto||0),0);
  cobrado += i.cobrado + abonos; porCobrar += i.porCobrar; gastos += i.egreso;
  return { cobrado, cancha, gastos, ingresos, porCobrar, insc:i,
           saldo: cobrado - cancha - gastos + ingresos,
           proyectado: cobrado + porCobrar - cancha - gastos + ingresos };
}
/* ---- tabla de posiciones del torneo ---- */
function tablaTorneo(){
  const t={};
  EQUIPOS.forEach(e=>t[e]={eq:e,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
  (S.torneo.fixture||[]).forEach(m=>{
    if(!m.jugado || m.gl==null || m.gv==null) return;
    const A=t[m.l], B=t[m.v]; if(!A||!B) return;
    const gl=+m.gl, gv=+m.gv;
    A.pj++; B.pj++; A.gf+=gl; A.gc+=gv; B.gf+=gv; B.gc+=gl;
    if(gl>gv){ A.g++; B.p++; A.pts+=3; }
    else if(gl<gv){ B.g++; A.p++; B.pts+=3; }
    else { A.e++; B.e++; A.pts++; B.pts++; }
  });
  return Object.values(t).map(x=>({...x, dif:x.gf-x.gc}))
    .sort((a,b)=> b.pts-a.pts || b.dif-a.dif || b.gf-a.gf || a.eq.localeCompare(b.eq));
}
function misFixtures(){ return (S.torneo.fixture||[]).filter(m=>m.l===NOS||m.v===NOS).sort((a,b)=>a.f-b.f); }
function proximoFixture(){
  const pend = misFixtures().filter(m=>!m.jugado);
  return pend.find(m=>!m.postergado) || pend[0] || null;   // una postergada no es "la próxima"
}
function postergar(i){
  const m = S.torneo.fixture[i];
  m.postergado = !m.postergado;
  m.nota = m.postergado? "Postergado" : "";
  if(!m.nota) delete m.nota;
  render(); toast(m.postergado? "Fecha "+m.f+" marcada como postergada" : "Fecha "+m.f+" vuelve al calendario");
}
function rivalDe(m){ return m.l===NOS? m.v : m.l; }
function datosProx(m){                    // fecha/hora/cancha si están cargados para ese rival
  const px = S.proximo||{};
  if(!m || !px.rival || px.rival!==rivalDe(m)) return "";
  const b=[];
  if(px.fecha) b.push(fdateLong(px.fecha).replace(/^(\S+)/, x=>({DOM:"Domingo",LUN:"Lunes",MAR:"Martes","MIÉ":"Miércoles",JUE:"Jueves",VIE:"Viernes","SÁB":"Sábado"}[x]||x)));
  if(px.hora)  b.push(px.hora+" hs");
  if(px.lugar) b.push(px.lugar);
  return b.join("  ·  ");
}
function esLocal(m){ return m.l===NOS; }
function posicion(){
  const t=tablaTorneo(); const i=t.findIndex(x=>x.eq===NOS);
  return { pos:i+1, fila:t[i]||null, total:t.length };
}
function statsJugador(j){
  let pj=0,g=0,a=0,am=0,rj=0,mvp=0,debe=0,pagado=0;
  const cr = credito(j.id);
  S.partidos.forEach(p=>{
    if(!(p.asistentes||[]).includes(j.id)) return;
    pj++;
    const e = ev(p,j.id); g+=e.g; a+=e.a; am+=e.am; rj+=e.rj;
    if(p.mvp===j.id) mvp++;
    if(exentoCuota(j.id)) return;                   // lo cubre el club
    const c = +p.cuota || S.cfg.cuota;
    if(p.pagos?.[j.id]) pagado+=c;
    else if(cr.cubiertos.has(p.id)) pagado+=c;      // cubierto con un adelanto
    else debe+=c;
  });
  const total = S.partidos.length;
  const i = insc();
  const cuentaInsc = j.activo!==false && !exentoInsc(j.id);
  const debeInsc = (cuentaInsc && !pagoInsc(j.id)) ? i.cuota : 0;
  const pgInsc   = (cuentaInsc &&  pagoInsc(j.id)) ? i.cuota : 0;
  return { pj,g,a,am,rj,mvp,debe,pagado, total, debeInsc, pagoInsc:pgInsc, exentoInsc:exentoInsc(j.id), exentoCuota:exentoCuota(j.id),
           aFavor: cr.aFavor, abonos: cr.total,
           debeTotal: debe+debeInsc, pagadoTotal: pagado+pgInsc,
           asist: total? Math.round(pj/total*100) : 0,
           gpp: pj? g/pj : 0, part:g+a };
}
function record(){
  let G=0,E=0,P=0,gf=0,gc=0;
  S.partidos.forEach(p=>{
    const f=+p.gf||0, c=+p.gc||0; gf+=f; gc+=c;
    if(f>c)G++; else if(f===c)E++; else P++;
  });
  return {G,E,P,gf,gc,dif:gf-gc,pj:S.partidos.length};
}
function tablaGoleadores(){
  return S.jugadores.map(j=>({j, s:statsJugador(j)}))
    .filter(x=>x.s.g>0)
    .sort((a,b)=> b.s.g-a.s.g || b.s.a-a.s.a || a.j.nombre.localeCompare(b.j.nombre));
}
function nombre(id){ const j=S.jugadores.find(x=>x.id===id); return j? j.nombre : "—"; }
function nombreFull(id){ const j=S.jugadores.find(x=>x.id===id); return j? j.nombre : "—"; }

function setFx(i,k,v){
  const m = S.torneo.fixture[i];
  m[k] = v===""? null : Math.max(0,+v||0);
  m.jugado = (m.gl!=null && m.gv!=null);
  if(m.jugado) delete m.nota;
  save();
  // refresco sólo la tabla para no perder el foco del input
  const t = $("#tab-torneo .card table tbody");
  if(t){ const tabla=tablaTorneo();
    t.innerHTML = tabla.map((r,ix)=>{
      const yoRow = r.eq===NOS;
      return `<tr style="${yoRow?"background:color-mix(in srgb,var(--accent) 14%,transparent)":""}">
        <td class="hint">${ix+1}</td><td class="name">${esc(r.eq)}${yoRow?' <span class="pill g">nosotros</span>':""}</td>
        <td class="num">${r.pj}</td><td class="num">${r.g}</td><td class="num">${r.e}</td><td class="num">${r.p}</td>

    }).join("");
  }
}

/* ---------- EL BARCO ---------- */
const BIRRA = 4;                       // precio de una birra, para el escabiómetro
const CABALAS = [
  "El que no salta se queda en el muelle.",
  "Cábala nueva: el que llega tarde paga la primera ronda.",
  "Si no lo ganamos jugando, lo ganamos corriendo.",
  "Nadie se baja del barco antes de zarpar.",
  "El que dice «no llegamos» rema de ida y de vuelta.",
  "Se juega como se entrena. Nosotros no entrenamos. Igual se juega.",
  "Hay equipo. Falta plata, pero hay equipo."
];
function barcoDatos(){
  const t = tablaTorneo(), yo = posicion(), f = fondo();
  const fila = yo.fila || {pts:0,pj:0};
  const restantes = Math.max(0, 7 - fila.pj);
  const enJuego = restantes*3;
  const sexto = t[5], septimo = t[6];
  const dentro = yo.pos <= 6;
  const margen = dentro ? fila.pts - (septimo? septimo.pts : 0)
                        : (sexto? sexto.pts : 0) - fila.pts;
  const birras = Math.floor(f.saldo / BIRRA);
  const birrasProy = Math.floor(f.proyectado / BIRRA);
  return {t, yo, fila, restantes, enJuego, dentro, margen, f, birras, birrasProy,
          sinJugar: fila.pj === 0};
}
function vBarco(){
  const d = barcoDatos();
  const {yo, fila, restantes, enJuego, dentro, margen, f} = d;
  let est, fra;
  if(d.sinJugar){
    est = "El barco está en el puerto";
    fra = "Todavía no jugamos nada. La buena: nadie nos ganó. La mala: tampoco le ganamos a nadie.";
  } else if(yo.pos <= 2){
    est = "Esto ya no es el barco, es un crucero";
    fra = "Vamos "+yo.pos+"º. Ojo con agrandarse, que después viene la pálida.";
  } else if(dentro){
    est = "Estamos arriba del barco";
    fra = yo.pos+"º con "+fila.pts+" puntos, "+(margen>0? margen+" arriba del séptimo" : "empatados con el séptimo")+". No aflojen que faltan "+restantes+" fecha"+(restantes===1?"":"s")+".";
  } else {
    est = "Por ahora, mirando desde el muelle";
    fra = yo.pos+"º. Faltan "+margen+" punto"+(margen===1?"":"s")+" para meterse entre los 6, y quedan "+enJuego+" en juego. Se puede.";
  }

  let h = `<div class="barcoHero">
    <div class="obj">Objetivo · Top 6 = Playoffs</div>
    <div class="est">${esc(est)}</div>
    <div class="fra">${esc(fra)}</div>
    <div class="escala">${d.t.map((r,i)=>`<div class="${r.eq===NOS? "yo" : i<6? "ok":"no"}" title="${esc(r.eq)}"></div>`).join("")}</div>
    <div class="escalaLbl"><span>1º</span><span style="color:var(--good)">◀ clasifican ▶</span><span>8º</span></div>
  </div>`;

  h += `<div class="tiles">
    <div class="tile"><div class="k">Puesto</div><div class="v">${yo.pos}º</div>
      <div class="n">${dentro? "adentro" : "afuera por "+margen+" pts"}</div></div>
    <div class="tile"><div class="k">Fechas que quedan</div><div class="v">${restantes}</div>
      <div class="n">${enJuego} puntos en juego</div></div>
    <div class="tile"><div class="k">Caja para el escabio</div><div class="v ${f.saldo<0?'neg':'pos'}">${money(f.saldo)}</div>
      <div class="n">${d.birras>=0? d.birras+" birras" : "debemos "+Math.abs(d.birras)+" birras"}</div></div>
    <div class="tile"><div class="k">Si cobramos todo</div><div class="v ${f.proyectado<0?'neg':'pos'}">${money(f.proyectado)}</div>
      <div class="n">${d.birrasProy>=0? d.birrasProy+" birras" : "seguimos en rojo"}</div></div>
  </div>`;

  h += `<div class="card"><h2>La cuenta fría</h2>
    <div class="chapa"><b>${fila.pts}</b><span>puntos tenemos hoy${d.sinJugar?" (todos los que trajimos de casa)":""}.</span></div>
    <div class="chapa"><b>${enJuego}</b><span>puntos quedan por repartir en las ${restantes} fecha${restantes===1?"":"s"} que faltan.</span></div>
    <div class="chapa"><b>${dentro? "+"+margen : "−"+margen}</b><span>${dentro? "puntos de ventaja sobre el 7º. Eso es lo que separa el barco del muelle." : "puntos hay que remontar para entrar. Dos triunfos y estamos hablando de otra cosa."}</span></div>
    <div class="chapa"><b>${money(S.cfg.cuota)}</b><span>por cabeza por partido. El que no viene igual no paga, pero después no pida lugar en la cubierta.</span></div>
  </div>`;

  const deudores = S.jugadores.map(j=>({j,s:statsJugador(j)})).filter(x=>x.s.debeTotal>0)
    .sort((a,b)=>b.s.debeTotal-a.s.debeTotal);
  if(deudores.length){
    h += `<div class="card"><h2>Los que reman para el otro lado</h2>
      <div class="hint" style="margin-top:-4px">Deben plata. El barco no zarpa con agujeros en el casco.</div>
      <div class="tblwrap"><table><tbody>` +
      deudores.map((x,i)=>`<tr><td class="hint">${i+1}</td><td class="name">${esc(x.j.nombre)}</td>
        <td class="num neg" style="font-weight:650">${money(x.s.debeTotal)}</td>
        <td class="hint num">${Math.round(x.s.debeTotal/BIRRA)} birras</td></tr>`).join("") +
      `<tr><td></td><td style="font-weight:700">Total del agujero</td>
        <td class="num neg" style="font-weight:700">${money(f.porCobrar)}</td>
        <td class="hint num">${Math.round(f.porCobrar/BIRRA)} birras</td></tr>
      </tbody></table></div></div>`;
  } else {
    h += `<div class="card"><h2>Los que reman para el otro lado</h2>
      <div class="empty">Nadie debe un peso. Anotalo, porque no va a volver a pasar.</div></div>`;
  }

  const prox = proximoFixture();
  if(prox){
    h += `<div class="card"><h2>La próxima parada</h2>
      <div class="spread">
        <div><div style="font-size:19px;font-weight:700">${esLocal(prox)?"vs ":"visitante a "}${esc(rivalDe(prox))}</div>
          <div class="hint">Fecha ${prox.f} · ${esc(S.torneo.nombre)}</div>
          ${datosProx(prox)? `<div style="margin-top:6px;font-weight:650;color:var(--accent)">${esc(datosProx(prox))}</div>`:""}</div>
        <div class="hint" style="text-align:right;max-width:200px">Ganás, sumás 3 y el barco se acerca. Perdés y bancate los memes del grupo.</div>
      </div></div>`;
  }

  const cab = CABALAS[(S.partidos.length + (S.jugadores.length||0)) % CABALAS.length];
  h += `<div class="card" style="text-align:center">
    <div class="hint" style="text-transform:uppercase;letter-spacing:.1em;font-weight:700">Cábala de la semana</div>
    <div style="font-size:17px;font-weight:650;margin-top:8px">"${esc(cab)}"</div></div>`;

  $("#tab-barco").innerHTML = h;
}

            </div>

function delMatch(id){
  if(!confirm("¿Borrar este partido? Se pierden sus estadísticas y pagos.")) return;
  S.partidos = S.partidos.filter(p=>p.id!==id); render(); toast("Partido borrado");
}
function cobrarTodo(id){
  const p = S.partidos.find(x=>x.id===id); if(!p) return;
  p.pagos = p.pagos || {};
  (p.asistentes||[]).forEach(j=>p.pagos[j]=true);
  render(); toast("Cobrado a todos los presentes");
}

function pickFx(v){
  if(v===""){ draft.fx=null; return; }
  const i = +v, m = S.torneo.fixture[i];
  draft.fx = i; draft.rival = rivalDe(m); draft.torneo = S.torneo.nombre+" · Fecha "+m.f;
  $("#m-rival").value = draft.rival; $("#m-torneo").value = draft.torneo;
}
function rosterRows(){
  const d = draft;
  return S.jugadores.filter(j=>j.activo!==false).map(j=>{
    const on = d.asistentes.includes(j.id);
    const e = ev(d,j.id);
    return `<div class="rrow ${on?"":"off"}" data-j="${j.id}">
      <span class="ctr"><input type="checkbox" ${on?"checked":""} onchange="tgAsist('${j.id}',this.checked)"></span>
      <span class="nm">${esc(j.nombre)}</span>
      <input type="number" min="0" value="${e.g}"  oninput="setEv('${j.id}','g',this.value)"  ${on?"":"disabled"}>
      <input type="number" min="0" value="${e.a}"  oninput="setEv('${j.id}','a',this.value)"  ${on?"":"disabled"}>
      <input type="number" min="0" value="${e.am}" oninput="setEv('${j.id}','am',this.value)" ${on?"":"disabled"}>
      <input type="number" min="0" value="${e.rj}" oninput="setEv('${j.id}','rj',this.value)" ${on?"":"disabled"}>
      <span class="ctr"><input type="radio" name="mvp" ${d.mvp===j.id?"checked":""} onchange="draft.mvp='${j.id}'" ${on?"":"disabled"}></span>
      ${exentoCuota(j.id)? `<span class="paychip club" title="Lo cubre el club">club</span>`
        : `<button class="paychip ${d.pagos[j.id]?"on":""}" onclick="tgPago('${j.id}')" ${on?"":"disabled"}>${d.pagos[j.id]?"✓ Sí":"No"}</button>`}
    </div>`;
  }).join("") || `<div class="empty">No hay jugadores activos.</div>`;
}
function tgAsist(id,on){
  const d=draft;
  if(on){ if(!d.asistentes.includes(id)) d.asistentes.push(id); }
  else { d.asistentes = d.asistentes.filter(x=>x!==id); delete d.pagos[id]; if(d.mvp===id) d.mvp=null; }
  syncDraftForm(); $("#rostBody").innerHTML = rosterRows(); refreshSum();
}
function setEv(id,k,v){ draft.eventos[id] = draft.eventos[id]||{}; draft.eventos[id][k] = Math.max(0,+v||0); }
function tgPago(id){ draft.pagos[id] = !draft.pagos[id]; $("#rostBody").innerHTML = rosterRows(); refreshSum(); }
function toggleAll(on){
  draft.asistentes = on ? S.jugadores.filter(j=>j.activo!==false).map(j=>j.id) : [];
  if(!on){ draft.pagos={}; draft.mvp=null; }
  $("#rostBody").innerHTML = rosterRows(); refreshSum();
}
function payAll(){ draft.asistentes.forEach(id=>draft.pagos[id]=true); $("#rostBody").innerHTML = rosterRows(); refreshSum(); }
function syncDraftForm(){
  const g = id => $("#"+id);
  if(!g("m-fecha")) return;
  const fxv = g("m-fx") ? g("m-fx").value : "";
  draft.fx = fxv===""? null : +fxv;
  draft.fecha=g("m-fecha").value; draft.rival=g("m-rival").value; draft.torneo=g("m-torneo").value;
  draft.gf=+g("m-gf").value||0; draft.gc=+g("m-gc").value||0;
  draft.cuota=+g("m-cuota").value||0; draft.cancha=+g("m-cancha").value||0;
  if(g("m-video")) draft.video = g("m-video").value.trim();
}
function refreshSum(){
  syncDraftForm();
  const f = matchFin(draft);
  $("#m-sum").textContent = f.n+" presentes · "+money(f.devengado)+" vs "+money(f.cancha);
  const r=$("#m-res"); r.textContent=(f.resultado>=0?"+":"")+money(f.resultado);
  r.className = f.resultado<0?"neg":"pos"; r.style.fontWeight="700";
  const m=$("#m-meter"); m.style.width=Math.min(100,f.breakeven? f.nPaga/f.breakeven*100:0)+"%";
  m.classList.toggle("ok", f.nPaga>=f.breakeven);
  $("#m-be").textContent = f.nPaga+" de "+f.breakeven+" que pagan";
}
function saveMatch(){
  syncDraftForm();
  if(!draft.rival.trim()) draft.rival = "Rival";
  const i = S.partidos.findIndex(p=>p.id===draft.id);
  if(i>=0) S.partidos[i]=draft; else S.partidos.push(draft);
  S.cfg.cuota = draft.cuota; S.cfg.cancha = draft.cancha;
  if(draft.fx!=null){                       // se refleja en la tabla del torneo
    const m = S.torneo.fixture[draft.fx];
    if(m){ const loc = esLocal(m);
      m.gl = loc? draft.gf : draft.gc;
      m.gv = loc? draft.gc : draft.gf;
      m.jugado = true; delete m.nota;
    }
  }
  closeModal(); render(); toast(draft.fx!=null? "Partido guardado y tabla actualizada" : "Partido guardado");
}

/* ---------- REPORTE DE MITAD DE TEMPORADA ---------- */
function repDatos(){
  const f = fondo(), r = record(), i = insc();
  const ps = ordenados();
  const cuota = S.cfg.cuota, cancha = S.cfg.cancha;
  const be = cuota>0 ? Math.ceil(cancha/cuota) : 0;

  let devengado=0, cobradoP=0, canchaT=0, cubreClub=0, pagaTot=0, presTot=0;
  const filas = ps.map(p=>{
    const m = matchFin(p);
    devengado+=m.devengado; cobradoP+=m.cobrado; canchaT+=m.cancha;
    cubreClub+=m.cubreClub; pagaTot+=m.nPaga; presTot+=m.n;
    return {p, m};
  });
  const promPaga = filas.length ? pagaTot/filas.length : 0;

  // partidos que faltan
  const pend = (S.torneo.fixture||[]).filter(m=>!m.jugado && (m.l===NOS || m.v===NOS));
  const resultadoAcum = f.proyectado;   // caja + lo que falta cobrar

  const mkEsc = n => ({ n, margen: n*cuota - cancha });
  const escenarios = [
    Object.assign(mkEsc(Math.max(0,be-1)), {rot:"Flojo"}),
    Object.assign(mkEsc(be),               {rot:"Justo"}),
    Object.assign(mkEsc(Math.round(promPaga)), {rot:"Normal", base:true}),
    Object.assign(mkEsc(Math.round(promPaga)+1), {rot:"Bueno"})
  ].filter((e,ix,arr)=> arr.findIndex(o=>o.n===e.n)===ix);

  // estadísticas
  const gol = tablaGoleadores();
  const asis = S.jugadores.map(j=>({j, s:statsJugador(j)})).filter(x=>x.s.pj>0)
                .sort((a,b)=> b.s.pj-a.s.pj || a.j.nombre.localeCompare(b.j.nombre));
  const mvps = S.jugadores.map(j=>({j, s:statsJugador(j)})).filter(x=>x.s.mvp>0)
                .sort((a,b)=> b.s.mvp-a.s.mvp);
  const amaris = S.jugadores.map(j=>({j, s:statsJugador(j)})).filter(x=>x.s.am>0)
                .sort((a,b)=> b.s.am-a.s.am);
  return {f,r,i,filas,devengado,cobradoP,canchaT,cubreClub,promPaga,presTot,be,cuota,cancha,
          pend,resultadoAcum,escenarios,gol,asis,mvps,amaris,pos:posicion()};
}

let sortKey="g", sortDir=-1;
function vPlantel(){
  const rows = S.jugadores.map(j=>({j,s:statsJugador(j)}));
  rows.sort((a,b)=>{
    if(sortKey==="nombre") return sortDir * a.j.nombre.localeCompare(b.j.nombre);
    return sortDir * ((a.s[sortKey]||0)-(b.s[sortKey]||0)) || a.j.nombre.localeCompare(b.j.nombre);
  });
  const cols = [["nombre","Apodo",0],["pj","PJ",1],["asist","Asist %",1],["g","⚽",1],["a","👟",1],

function sortBy(k){ if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir = k==="nombre"?1:-1; } render(); }
function addPlayer(){
  const n=$("#j-nom").value.trim(); if(!n){ toast("Poné un apodo"); return; }
  S.jugadores.push({id:uid(), nombre:n, activo:true});
  render(); toast(n+" agregado"); $("#j-nom").focus();
}
function addBulk(){
  const txt = $("#j-bulk").value.trim(); if(!txt){ toast("Pegá la lista primero"); return; }
  let n=0;
  txt.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const nom = l.split(",")[0].trim();
    if(!nom) return;
    S.jugadores.push({id:uid(), nombre:nom, activo:true});
    n++;
  });
  render(); toast(n+" jugadores cargados");
}
function editPlayer(id){
  const j = S.jugadores.find(x=>x.id===id);
  openModal(`<h2>${esc(j.nombre)}</h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
      <label class="f">Apodo<input id="e-nom" value="${esc(j.nombre)}"></label>
      <label class="f">Estado<select id="e-act"><option value="1" ${j.activo!==false?"selected":""}>Activo</option><option value="0" ${j.activo===false?"selected":""}>Inactivo</option></select></label>
    </div>
    <div class="sticky-actions">
      <button class="btn danger" onclick="delPlayer('${j.id}')">Eliminar</button>
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="savePlayer('${j.id}')">Guardar</button>
    </div>`);
}
function savePlayer(id){
  const j = S.jugadores.find(x=>x.id===id);
  j.nombre=$("#e-nom").value.trim()||j.nombre; j.activo=$("#e-act").value==="1";
  closeModal(); render(); toast("Guardado");
}
function delPlayer(id){
  if(!confirm("¿Eliminar el jugador? Se borra de todos los partidos.")) return;
  S.jugadores = S.jugadores.filter(x=>x.id!==id);
  S.partidos.forEach(p=>{
    p.asistentes=(p.asistentes||[]).filter(x=>x!==id);
    delete p.eventos?.[id]; delete p.pagos?.[id]; if(p.mvp===id) p.mvp=null;
  });
  closeModal(); render(); toast("Jugador eliminado");
}

function saldar(id){
  S.partidos.forEach(p=>{ if((p.asistentes||[]).includes(id)){ p.pagos=p.pagos||{}; p.pagos[id]=true; } });
  if(!exentoInsc(id)){ S.torneo.inscPagos = S.torneo.inscPagos||{}; S.torneo.inscPagos[id]=true; }
  render(); toast(nombre(id)+" quedó al día");
}
function addAbono(){
  const jid=$("#ab-j").value, m=+$("#ab-m").value||0;
  if(!jid || !m){ toast("Elegí jugador y monto"); return; }
  S.abonos = S.abonos||[];
  S.abonos.push({id:uid(), jid, fecha:$("#ab-f").value||hoy(), monto:m, nota:$("#ab-n").value.trim()});
  render(); toast("Adelanto de "+nombre(jid)+" cargado");
}
function delAbono(id){ S.abonos=(S.abonos||[]).filter(a=>a.id!==id); render(); }
function setInsc(){
  S.torneo.inscripcion = +$("#i-monto").value||0;
  S.torneo.inscCuota = +$("#i-cuota").value||0;
  S.torneo.inscFecha = $("#i-fecha").value;
  S.torneo.inscPagada = $("#i-pagada").value==="1";
  render(); toast("Inscripción actualizada");
}
function tgInsc(id){
  S.torneo.inscPagos = S.torneo.inscPagos||{};
  S.torneo.inscPagos[id] = !S.torneo.inscPagos[id];
  render();
}
function tgExento(id){
  S.torneo.inscExentos = S.torneo.inscExentos||{};
  if(S.torneo.inscExentos[id]) delete S.torneo.inscExentos[id];
  else { S.torneo.inscExentos[id]=true; delete (S.torneo.inscPagos||{})[id]; }
  render();
  toast(exentoInsc(id)? nombre(id)+" no paga la inscripción" : "Se le vuelve a cobrar a "+nombre(id));
}

  </div>`;

  if(cats.length){
    h += `<div class="card"><h2>Gastos por categoría</h2><div class="bars">` +
      cats.map(([c,v])=>`<div class="bar"><div class="lb">${esc(c)}</div>
        <div class="tr"><div class="fl" style="width:${Math.max(3,v/maxC*100)}%;background:var(--s2)"></div></div>

function addMov(){
  const c=$("#g-con").value.trim(), m=+$("#g-monto").value||0;

function delMov(id){ S.mov = S.mov.filter(m=>m.id!==id); render(); }

function tgConv(id){

  if(i>=0) S.proximo.convocados.splice(i,1); else S.proximo.convocados.push(id);
  save(); render();
}
function convocados(){
  const ids = S.proximo.convocados || [];
  return activos().filter(j=>ids.includes(j.id));
}
function setFmt(k){ postFmt=k; render(); }
function setEstilo(k){ plantelEstilo=k; render(); }
function usarFixture(){
  const m = proximoFixture(); if(!m) return;

}
function setProx(){

function copyCap(){

}
function dlPost(){

}

/* ---- escudo para el canvas ---- */
let LOGO=null;
function cargarLogo(){
  const src = S.marca?.logo || LOGO_SRC;
  if(!src){ LOGO=null; return; }
  if(LOGO && LOGO._src===src) return;
  LOGO = new Image(); LOGO._src=src;
  LOGO.onload = ()=>{ if(tab==="posts") drawPost(); };
  LOGO.src = src;
}
function subirLogo(inp){
  const f=inp.files[0]; if(!f) return;
  if(f.size > 2_000_000){ toast("La imagen es muy pesada (máx 2 MB)"); return; }
  const r=new FileReader();
  r.onload=()=>{ S.marca.logo=r.result; LOGO=null; cargarLogo(); save(); render(); toast("Escudo actualizado"); };
  r.readAsDataURL(f);
}
function resetLogo(){ S.marca.logo=null; LOGO=null; cargarLogo(); render(); toast("Escudo original restaurado"); }

/* ---- helpers de canvas ---- */
function rr(x,y,w,h,r){
  const c=CTX; c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function txt(s,x,y,{size=48,weight=600,color="#fff",align="left",track=0,max=0}={}){
  const c=CTX;
  c.font = weight+" "+size+'px system-ui,-apple-system,"Segoe UI",sans-serif';
  if(max){ let sz=size; while(c.measureText(s).width>max && sz>14){ sz-=2; c.font = weight+" "+sz+'px system-ui,-apple-system,"Segoe UI",sans-serif'; } }
  c.fillStyle=color; c.textAlign=align; c.textBaseline="alphabetic";
  if(track){
    const chars=[...String(s)]; const w=chars.reduce((s2,ch)=>s2+c.measureText(ch).width,0)+track*(chars.length-1);
    let cx = align==="center"? x-w/2 : align==="right"? x-w : x;
    c.textAlign="left"; chars.forEach(ch=>{ c.fillText(ch,cx,y); cx+=c.measureText(ch).width+track; });
  } else c.fillText(String(s),x,y);
}
/* =========================================================
   PLACAS DEL PLANTEL — tres direcciones de arte
   ========================================================= */
function bandasBandera(W,H,x0,x1,alpha){       // franjas celeste/blanco/celeste del escudo
  const c=CTX, bw=(x1-x0)/3;
  c.save(); c.globalAlpha=alpha;
  c.fillStyle="#6bace4"; c.fillRect(x0,0,bw,H); c.fillRect(x0+bw*2,0,bw,H);
  c.fillStyle="#ffffff"; c.fillRect(x0+bw,0,bw,H);
  c.restore();
}
function rayosSol(cx,cy,r,alpha){              // rayos del sol del escudo
  const c=CTX; c.save(); c.globalAlpha=alpha; c.fillStyle="#eeb425";
  for(let i=0;i<24;i++){
    const a=i*Math.PI/12;
    c.beginPath(); c.moveTo(cx,cy);
    c.lineTo(cx+Math.cos(a-0.028)*r, cy+Math.sin(a-0.028)*r);
    c.lineTo(cx+Math.cos(a+0.028)*r, cy+Math.sin(a+0.028)*r);
    c.closePath(); c.fill();
  }
  c.restore();
}
function logoAt(x,y,h){
  if(!(LOGO && LOGO.complete && LOGO.naturalWidth)) return 0;
  const w=h*(LOGO.naturalWidth/LOGO.naturalHeight);
  CTX.drawImage(LOGO, x-w/2, y, w, h); return w;
}

/* ---- A · Bandera: escudo grande, franjas y lista numerada ---- */
function plantelBandera(js,W,H,P,A,GOLD,INK,DIM){
  const c=CTX, story=postFmt==="story";
  bandasBandera(W,H,W*0.16,W*0.84,0.055);
  const lh = story? 260 : 132;
  const yLogo = story? 300 : 160;
  rayosSol(W/2, yLogo+lh*0.5, W*0.66, 0.05);
  logoAt(W/2, yLogo, lh);

  const yT = yLogo + lh + (story?96:62);
  txt("EL PLANTEL", W/2, yT, {size:story?78:50, weight:800, color:INK, align:"center", track:10, max:W-P*2});
  c.fillStyle=GOLD; c.fillRect(W/2-70, yT+26, 140, 4);
  txt(S.torneo.nombre.toUpperCase()+"  ·  "+S.torneo.org.toUpperCase(), W/2, yT+72,
      {size:story?24:18, weight:700, color:A, align:"center", track:5, max:W-P*2});

  const cols = js.length>9? 2 : 1;
  const rows = Math.ceil(js.length/cols);
  const gap  = 22;
  const cw   = (W-P*2-gap*(cols-1))/cols;
  const y0   = yT + (story?140:104);
  const rh   = Math.min(story?98:60, ((H-(story?150:88))-y0)/rows);
  const fs   = Math.max(17, Math.min(cols===1?52:40, rh*0.46));
  js.forEach((j,i)=>{
    const col = cols===1?0:i%cols, fil = cols===1?i:Math.floor(i/cols);
    const x = P+col*(cw+gap), y = y0+fil*rh;
    c.fillStyle="rgba(255,255,255,.055)"; rr(x,y,cw,rh-10,12); c.fill();
    txt(String(i+1).padStart(2,"0"), x+30, y+(rh-10)/2+fs*0.34, {size:fs*0.72, weight:800, color:A, align:"center"});
    c.fillStyle="rgba(255,255,255,.14)"; c.fillRect(x+56, y+12, 2, rh-34);
    const g = statsJugador(j).g;
    txt(j.nombre, x+74, y+(rh-10)/2+fs*0.34, {size:fs, weight:700, color:INK, max:cw-(g>0?150:96)});
    if(g>0) txt("⚽"+g, x+cw-22, y+(rh-10)/2+fs*0.3, {size:fs*0.6, weight:750, color:GOLD, align:"right"});
  });
}

/* ---- B · Dorsales: número gigante detrás de cada nombre ---- */
function plantelDorsales(js,W,H,P,A,GOLD,INK,DIM){
  const c=CTX, story=postFmt==="story";
  const yT = story? 430 : 252;
  c.save(); c.globalAlpha=.13; c.fillStyle=A;                 // banda diagonal
  c.beginPath(); c.moveTo(0,story?150:96); c.lineTo(W,story?96:70);
  c.lineTo(W, yT+(story?54:38)); c.lineTo(0, yT+(story?96:64)); c.closePath(); c.fill();
  c.restore();

  txt("PLANTEL", P, yT, {size:story?108:66, weight:800, color:INK, track:1, max:W-P*2});
  txt(S.torneo.nombre.toUpperCase()+"  ·  "+js.length+" JUGADORES", P, yT+(story?56:40),
      {size:story?25:18, weight:700, color:A, track:5, max:W-P*2});
  c.fillStyle=GOLD; c.fillRect(P, yT+(story?82:58), 96, 5);

  const y0  = yT + (story?150:100);
  const rh  = Math.min(story?92:56, ((H-(story?150:92))-y0)/js.length);
  const gut = story? 150 : 96;
  const fs  = Math.max(16, Math.min(story?48:32, rh*0.55));
  js.forEach((j,i)=>{
    const y = y0 + i*rh, mid = y + rh/2;
    txt(String(i+1).padStart(2,"0"), P+gut-22, mid+rh*0.33, {size:rh*0.92, weight:800, color:"rgba(107,172,228,.26)", align:"right"});
    txt(j.nombre.toUpperCase(), P+gut+14, mid+fs*0.34, {size:fs, weight:750, color:INK, track:1, max:W-P*2-gut-130});
    const g = statsJugador(j).g;
    if(g>0) txt("⚽ "+g, W-P, mid+fs*0.3, {size:fs*0.62, weight:750, color:GOLD, align:"right"});
    c.fillStyle="rgba(255,255,255,.07)"; c.fillRect(P, y+rh-1, W-P*2, 1);
  });
}

/* ---- C · Editorial: tipografía apilada, alternando blanco y celeste ---- */
function plantelEditorial(js,W,H,P,A,GOLD,INK,DIM){
  const c=CTX, story=postFmt==="story";
  PIE = false;                                   // esta lleva barra propia abajo
  const top = story? 410 : 250;
  c.save(); c.translate(46, story? 1240 : 740); c.rotate(-Math.PI/2);
  txt("PLANTEL "+S.torneo.nombre.toUpperCase(), 0, 0, {size:story?24:17, weight:750, color:A, track:8});
  c.restore();

  txt("TEMPORADA", P+30, top, {size:story?66:42, weight:800, color:DIM, track:4, max:W-P*2-60});
  txt("2026", P+30, top+(story?70:44), {size:story?66:42, weight:800, color:DIM, track:4});
  c.fillStyle=GOLD; c.fillRect(P+30, top+(story?98:62), 110, 5);

  const barra = story?116:78;
  const y0 = top + (story?160:100);
  const bottom = H - barra - (story?36:22);
  const rh = Math.min(story?92:52, (bottom-y0)/js.length);
  const fs = Math.max(16, rh*0.85);
  js.forEach((j,i)=>{
    txt(j.nombre.toUpperCase(), P+30, y0 + i*rh + rh*0.78,
        {size:fs, weight:800, color:i%2? A : INK, max:W-P*2-90});
  });
  c.fillStyle=A; c.fillRect(0, H-barra, W, barra);
  txt(S.club.toUpperCase()+"  ·  "+js.length+" JUGADORES", W/2, H-barra/2+(story?10:8),
      {size:story?28:20, weight:800, color:"#08131d", align:"center", track:5, max:W-80});
}

let CTX=null, PIE=true;
function drawPost(){
  const cv=$("#preview"); if(!cv) return;
  const W=1080, H = postFmt==="story"? 1920 : 1080;
  cv.width=W; cv.height=H; CTX = cv.getContext("2d"); const c=CTX;
  const A = "#6bace4", GOLD="#eeb425", INK="#ffffff", DIM="#9fb3c6";
  PIE = true;

  // fondo negro, como el escudo
  const g=c.createLinearGradient(0,0,W,H);
  g.addColorStop(0,"#0d1218"); g.addColorStop(.5,"#040507"); g.addColorStop(1,"#0b1017");
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // rayas diagonales celestes
  c.save(); c.globalAlpha=.055; c.strokeStyle=A; c.lineWidth=40;
  for(let i=-H;i<W+H;i+=110){ c.beginPath(); c.moveTo(i,0); c.lineTo(i+H,H); c.stroke(); }
  c.restore();
  // glow celeste
  const rg=c.createRadialGradient(W*0.5,H*0.36,0,W*0.5,H*0.36,W*0.8);
  rg.addColorStop(0,"rgba(107,172,228,.20)"); rg.addColorStop(1,"rgba(0,0,0,0)");
  c.fillStyle=rg; c.fillRect(0,0,W,H);
  // escudo de marca de agua
  if(LOGO && LOGO.complete && LOGO.naturalWidth){
    c.save(); c.globalAlpha=.07;
    const s = W*0.34, ar = LOGO.naturalHeight/LOGO.naturalWidth;
    c.drawImage(LOGO, W-80-s, H-40-s*ar, s, s*ar);
    c.restore();
  }

  const P=80, top = postFmt==="story"? 230 : 110;
  // header club
  if(LOGO && LOGO.complete && LOGO.naturalWidth){
    const hh=76, ww=hh*(LOGO.naturalWidth/LOGO.naturalHeight);
    c.drawImage(LOGO, P, top-80, ww, hh);

  } else {
    c.fillStyle=A; rr(P,top-70,64,64,18); c.fill();

  c.fillStyle="rgba(107,172,228,.30)"; c.fillRect(P, top+6, W-P*2, 2);

  const mid = postFmt==="story"? 720 : 300;
  let cap="";
  const ult = ultimoPartido();

  if(postType==="resultado"){
    if(!ult){ txt("Cargá un partido primero", W/2, mid+40, {size:44, align:"center", color:DIM}); }
    else{
      const win = ult.gf>ult.gc, draw = ult.gf===ult.gc;

      txt(fdateLong(ult.fecha)+"  ·  "+(ult.torneo||"Amistoso").toUpperCase(), W/2, mid+52, {size:26, color:DIM, align:"center", track:2});
      // marcador

      txt(S.club.toUpperCase()+"  vs  "+(ult.rival||"RIVAL").toUpperCase(), W/2, yS+70, {size:32, weight:600, color:DIM, align:"center", track:2, max:W-P*2});
      // goleadores

        (sc.length? `⚽ ${sc.map(s=>nombreFull(s.id)+(s.g>1?" x"+s.g:"")).join(", ")}\n`:"")+
        (ult.mvp? `★ Figura: ${nombreFull(ult.mvp)}\n`:"")+

      txt("en "+top.s.pj+" partidos  ·  "+top.s.gpp.toFixed(2)+" por partido", W/2, mid+425, {size:28, color:DIM, align:"center"});

    }
  }

  if(postType==="tabla"){
    const t = tablaGoleadores().slice(0, postFmt==="story"?9:7);
    txt("TABLA DE GOLEADORES", W/2, mid-40, {size:36, weight:750, color:A, align:"center", track:5});
    if(!t.length){ txt("Sin goles cargados", W/2, mid+90, {size:40, align:"center", color:DIM}); }

      let y = mid+70;
      t.forEach((x,i)=>{
        c.fillStyle = i%2? "rgba(255,255,255,.03)":"rgba(255,255,255,.06)";
        rr(P, y-46, W-P*2, 78, 16); c.fill();
        txt(String(i+1), P+38, y+8, {size:34, weight:800, color:i===0?"#eeb425":DIM, align:"center"});
        txt(x.j.nombre, P+86, y+8, {size:38, weight:650, color:INK, max:W-P*2-230});
        txt(x.s.g, W-P-34, y+10, {size:46, weight:800, color:i===0?"#eeb425":INK, align:"right"});
        y += 94;
      });
      cap = `📊 Tabla de goleadores\n`+t.map((x,i)=>`${i+1}. ${x.j.nombre} — ${x.s.g}`).join("\n")+
        `\n\n#${S.club.replace(/\s+/g,"")} #goleadores #superliga8v8`;
    }
  }

  if(postType==="convocatoria"){
    const px = S.proximo, fx = proximoFixture();
    const rival = px.rival || (fx? rivalDe(fx) : "");
    const tit = fx && rivalDe(fx)===rival ? "FECHA "+fx.f+" · "+S.torneo.nombre.toUpperCase() : "PRÓXIMO PARTIDO";
    txt(tit, W/2, mid, {size:34, weight:750, color:A, align:"center", track:5, max:W-P*2});
    txt((rival||"A CONFIRMAR").toUpperCase(), W/2, mid+130, {size:74, weight:800, color:INK, align:"center", max:W-P*2});
    txt("vs", W/2, mid+66, {size:30, color:DIM, align:"center"});
    let y = mid+230;
    const linea = (ic,t1,t2)=>{
      c.fillStyle="rgba(255,255,255,.06)"; rr(P,y-48,W-P*2,86,18); c.fill();
      txt(ic, P+44, y+10, {size:36, align:"center"});
      txt(t1, P+92, y+2, {size:22, color:DIM, track:2});
      txt(t2, W-P-30, y+10, {size:36, weight:650, color:INK, align:"right", max:W-P*2-260});
      y+=104;
    };
    linea("📅","FECHA", px.fecha? fdateLong(px.fecha) : "A confirmar");
    linea("🕗","HORA", px.hora||"A confirmar");
    linea("📍","CANCHA", px.lugar|| (fx? (esLocal(fx)?"Local":"Visitante")+" · a confirmar" : "A confirmar"));
    linea("💵","CUOTA", money(S.cfg.cuota)+" por jugador");
    y += 20;
    txt("CONFIRMÁ TU LUGAR EN EL GRUPO", W/2, y+10, {size:26, weight:700, color:A, align:"center", track:3});
    txt("Somos "+S.cfg.formato+" · necesitamos "+Math.ceil(S.cfg.cancha/S.cfg.cuota)+" para cubrir la cancha", W/2, y+56, {size:24, color:DIM, align:"center"});
    cap = `⚽ ${fx? "FECHA "+fx.f+" · "+S.torneo.nombre : "PRÓXIMO PARTIDO"}\nvs ${rival||"a confirmar"}\n📅 ${px.fecha? fdateLong(px.fecha):"a confirmar"} · 🕗 ${px.hora||"a confirmar"}\n📍 ${px.lugar||"a confirmar"}\n💵 ${money(S.cfg.cuota)} por jugador\n\nConfirmá en el grupo 🙌\n\n#${S.club.replace(/\s+/g,"")} #superliga8v8 #ps23soccer`;
  }

  if(postType==="convocados"){
    const js = convocados(), px = S.proximo||{}, fx = proximoFixture();
    const story = postFmt==="story";
    const yT = story? 380 : 230;
    txt((fx? "FECHA "+fx.f+" · " : "")+S.torneo.nombre.toUpperCase(), W/2, yT,
        {size:story?26:20, weight:750, color:A, align:"center", track:5, max:W-P*2});
    txt("LOS CONVOCADOS", W/2, yT+(story?76:54), {size:story?68:46, weight:800, color:INK, align:"center", track:4, max:W-P*2});
    c.fillStyle=GOLD; c.fillRect(W/2-70, yT+(story?100:72), 140, 4);
    const rival = px.rival || (fx? rivalDe(fx) : "");
    txt((fx&&!esLocal(fx)?"visitante a ":"vs ").toUpperCase()+rival.toUpperCase(), W/2, yT+(story?150:106),
        {size:story?34:24, weight:700, color:INK, align:"center", max:W-P*2});
    const info=[]; if(px.fecha) info.push(fdateLong(px.fecha)); if(px.hora) info.push(px.hora); if(px.lugar) info.push(px.lugar);
    if(info.length) txt(info.join("  ·  "), W/2, yT+(story?196:140), {size:story?26:19, weight:600, color:DIM, align:"center", track:2, max:W-P*2});

    if(!js.length){ txt("Marcá los convocados en la app", W/2, yT+300, {size:38, align:"center", color:DIM}); }
    else{
      const cols = js.length>7? 2 : 1;
      const rows = Math.ceil(js.length/cols), gap=20;
      const cw = (W-P*2-gap*(cols-1))/cols;
      const y0 = yT + (story?250:180);
      const rh = Math.min(story?100:62, ((H-(story?190:110))-y0)/rows);
      const fs = Math.max(17, Math.min(cols===1?50:40, rh*0.46));
      js.forEach((j,i)=>{
        const col = cols===1?0:i%cols, fil = cols===1?i:Math.floor(i/cols);
        const x = P+col*(cw+gap), y = y0+fil*rh;
        c.fillStyle="rgba(107,172,228,.12)"; rr(x,y,cw,rh-10,12); c.fill();
        txt("✓", x+30, y+(rh-10)/2+fs*0.34, {size:fs*0.8, weight:800, color:A, align:"center"});
        txt(j.nombre, x+62, y+(rh-10)/2+fs*0.34, {size:fs, weight:700, color:INK, max:cw-84});
      });
      const total = js.length*S.cfg.cuota, sobra = total - S.cfg.cancha;
      txt(js.length+" CONFIRMADOS  ·  "+money(S.cfg.cuota)+" POR CABEZA", W/2, H-(story?118:76),
          {size:story?26:19, weight:750, color:sobra>=0? "#0ca30c" : "#e66767", align:"center", track:3, max:W-P*2});
    }
    cap = `⚽ CONVOCADOS · ${fx? "Fecha "+fx.f : "Próximo partido"} ${S.torneo.nombre}\n`+
      `${fx&&!esLocal(fx)?"visitante a ":"vs "}${rival}\n`+
      (info.length? info.join(" · ")+"\n" : "")+`\n`+
      js.map((j,i)=>(i+1)+". "+j.nombre).join("\n")+
      `\n\n${js.length} confirmados · ${money(S.cfg.cuota)} por cabeza\n\n#${S.club.replace(/\s+/g,"")} #superliga8v8 #ps23soccer`;
  }

  if(postType==="plantel"){
    const js = activos();
    if(!js.length){ txt("Cargá el plantel primero", W/2, H/2, {size:44, align:"center", color:DIM}); }
    else if(plantelEstilo==="bandera")   plantelBandera(js,W,H,P,A,GOLD,INK,DIM);
    else if(plantelEstilo==="dorsales")  plantelDorsales(js,W,H,P,A,GOLD,INK,DIM);
    else                                 plantelEditorial(js,W,H,P,A,GOLD,INK,DIM);
    cap = `⚽ ESTE ES EL PLANTEL DE ${S.club.toUpperCase()}\n${S.torneo.nombre} · ${S.torneo.org}\n\n`+
      js.map((j,i)=>String(i+1).padStart(2,"0")+"  "+j.nombre).join("\n")+
      `\n\n${js.length} jugadores. Vamos ${S.club} 💪\n\n#${S.club.replace(/\s+/g,"")} #plantel #superliga8v8 #ps23soccer`;
  }

  if(postType==="posiciones"){
    const t = tablaTorneo();
    txt(S.torneo.nombre.toUpperCase(), W/2, mid-60, {size:34, weight:750, color:A, align:"center", track:5, max:W-P*2});
    txt("TABLA DE POSICIONES", W/2, mid-16, {size:22, weight:600, color:DIM, align:"center", track:4});
    const rh = postFmt==="story"? 96 : 78;
    let y = mid + (postFmt==="story"? 90 : 60);
    txt("PJ", W-P-186, y-30, {size:18, weight:650, color:DIM, align:"center"});
    txt("DIF", W-P-116, y-30, {size:18, weight:650, color:DIM, align:"center"});
    txt("PTS", W-P-38,  y-30, {size:18, weight:650, color:DIM, align:"center"});
    t.forEach((r,i)=>{
      const yo = r.eq===NOS;
      c.fillStyle = yo? "rgba(107,172,228,.26)" : (i%2? "rgba(255,255,255,.03)":"rgba(255,255,255,.06)");
      rr(P, y-rh*0.58, W-P*2, rh-12, 15); c.fill();
      txt(String(i+1), P+34, y+8, {size:26, weight:800, color:i<3?"#eeb425":DIM, align:"center"});
      txt(r.eq, P+70, y+8, {size:30, weight:yo?800:600, color:INK, max:W-P*2-330});
      txt(r.pj,  W-P-186, y+8, {size:28, weight:600, color:DIM, align:"center"});
      txt((r.dif>0?"+":"")+r.dif, W-P-116, y+8, {size:28, weight:600, color:DIM, align:"center"});
      txt(r.pts, W-P-38,  y+8, {size:32, weight:800, color:INK, align:"center"});
      y += rh;
    });
    const yo = posicion();
    cap = `📊 Tabla de la ${S.torneo.nombre} (${S.torneo.org})\n`+
      t.map((r,i)=>`${i+1}. ${r.eq} — ${r.pts} pts`).join("\n")+
      `\n\nVamos ${yo.pos}º 💪\n\n#${S.club.replace(/\s+/g,"")} #superliga8v8 #ps23soccer`;
  }

  if(postType==="balance"){
    const f = fondo(), r = record();
    txt("LA TEMPORADA EN NÚMEROS", W/2, mid-30, {size:34, weight:750, color:A, align:"center", track:4});
    const yo = posicion();
    const cells = [
      ["POSICIÓN", yo.pos+"º de "+yo.total], ["PUNTOS", String(yo.fila?yo.fila.pts:0)],
      ["PARTIDOS", String(r.pj)], ["RÉCORD", r.G+"-"+r.E+"-"+r.P],
      ["GOLES", r.gf+" : "+r.gc], ["FONDO DEL EQUIPO", money(f.saldo)]
    ];
    const cw=(W-P*2-24)/2, ch = postFmt==="story"? 190 : 150;
    cells.forEach((cell,i)=>{
      const x = P + (i%2)*(cw+24), y = mid+60 + Math.floor(i/2)*(ch+22);
      c.fillStyle="rgba(255,255,255,.06)"; rr(x,y,cw,ch,20); c.fill();
      txt(cell[0], x+28, y+44, {size:20, weight:650, color:DIM, track:2});
      txt(cell[1], x+28, y+ch-38, {size:56, weight:800, color:INK, max:cw-56});
    });
    cap = `📊 ${S.club} — la temporada hasta hoy\n${yo.pos}º en la ${S.torneo.nombre} con ${yo.fila?yo.fila.pts:0} pts\n${r.pj} partidos · ${r.G}G ${r.E}E ${r.P}P\n${r.gf} goles a favor, ${r.gc} en contra\n💰 Fondo del equipo: ${money(f.saldo)}\n\n#${S.club.replace(/\s+/g,"")} #superliga8v8 #ps23soccer`;
  }

  // pie
  if(PIE) txt("@"+S.club.toLowerCase().replace(/\s+/g,""), W/2, H-64, {size:24, color:"rgba(255,255,255,.35)", align:"center", track:3});

  const cb=$("#caption"); if(cb && document.activeElement!==cb) cb.value = cap.trim();
}

/* =========================================================
   MODAL / DATOS / INIT
   ========================================================= */
function openModal(html){ $("#sheet").innerHTML=html; $("#modal").classList.add("on"); }
function closeModal(){ $("#modal").classList.remove("on"); }
$("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

function goTab(t){ tab=t; render(); window.scrollTo(0,0); }
$("#tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) goTab(b.dataset.t); });
$("#clubName").addEventListener("input", e=>{ S.club=e.target.value||"Westjan FC"; save(); });
$("#clubName").addEventListener("blur", render);
$("#btnTheme").addEventListener("click", ()=>{
  const d = document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme", d?"light":"dark");
  try{ LS && LS.setItem("westjan-tema", d?"light":"dark"); }catch(e){}
});
$("#btnPub").addEventListener("click", exportarPublico);
$("#btnData").addEventListener("click", ()=>{
  const f = fondo();
  openModal(`<h2>Datos y respaldo</h2>
    <p class="hint"><b>Versión ${VER}</b> · ${LS? "Los datos se guardan solos en este navegador." : "⚠️ Este navegador no permite guardar. Exportá el archivo antes de cerrar."}
    Exportá un respaldo cada tanto y compartilo con el grupo.</p>
    <div class="row" style="margin-top:14px;align-items:center;gap:14px">
      <div class="crest" style="width:56px;height:56px">${(S.marca?.logo||LOGO_SRC)?`<img src="${S.marca?.logo||LOGO_SRC}" alt="Escudo">`:esc(S.emoji||"⚽")}</div>
      <div>
        <button class="btn ghost sm" onclick="$('#logoUp').click()">Cambiar escudo</button>
        ${S.marca?.logo?`<button class="btn ghost sm" onclick="resetLogo()">Volver al original</button>`:""}
        <input type="file" id="logoUp" accept="image/*" style="display:none" onchange="subirLogo(this)">
        <div class="hint" style="margin-top:4px">Colores: celeste #6BACE4, blanco y sol #EEB425 del escudo.</div>
      </div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:14px">
      <label class="f">Emoji de respaldo<input id="d-emoji" value="${esc(S.emoji)}" maxlength="4"></label>
      <label class="f">Formato<input id="d-fmt" value="${esc(S.cfg.formato)}"></label>
      <label class="f">Cuota por jugador<input type="number" id="d-cuota" value="${S.cfg.cuota}"></label>
      <label class="f">Costo de cancha<input type="number" id="d-cancha" value="${S.cfg.cancha}"></label>
    </div>
    <div class="hint" style="margin-top:8px">Se cubre con ${Math.ceil((+S.cfg.cancha||0)/(+S.cfg.cuota||1))} jugadores. Fondo actual: <b>${money(f.saldo)}</b>.</div>
    <div class="row" style="margin-top:16px">
      <button class="btn ghost sm" onclick="exportJSON()">⬇ Exportar respaldo</button>
      <button class="btn ghost sm" onclick="copiarDatos()">📋 Copiar datos</button>
      <button class="btn ghost sm" onclick="$('#imp').click()">⬆ Importar respaldo</button>
      <button class="btn ghost sm" onclick="exportCSV()">⬇ Exportar CSV</button>
      <button class="btn danger sm" onclick="wipe()">Borrar todo</button>
      <input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(this)">
    </div>
    <div id="dlBox" style="margin-top:12px"></div>
    <div class="sticky-actions"><button class="btn" onclick="saveCfg()">Guardar</button></div>`);
});
function saveCfg(){
  S.emoji=$("#d-emoji").value||"⚽"; S.cfg.formato=$("#d-fmt").value||"F8";
  S.cfg.cuota=+$("#d-cuota").value||20; S.cfg.cancha=+$("#d-cancha").value||180;
  closeModal(); render(); toast("Configuración guardada");
}
function construirPublico(){
  const clone = document.documentElement.cloneNode(true);
  clone.querySelectorAll("main section.tab").forEach(x=>x.innerHTML="");
  const sh = clone.querySelector("#sheet"); if(sh) sh.innerHTML="";
  const md = clone.querySelector("#modal"); if(md) md.classList.remove("on");
  const ts = clone.querySelector("#toast"); if(ts){ ts.textContent=""; ts.classList.remove("on"); }
  const inp = clone.querySelector("#clubName"); if(inp) inp.setAttribute("value", S.club);
  const sc = document.createElement("script");
  sc.textContent = "window.__WJ_RO__ = "+JSON.stringify(S)+";\nwindow.__WJ_FECHA__ = "+JSON.stringify(hoy())+";";
  clone.querySelector("head").appendChild(sc);
  return "<!DOCTYPE html>\n"+clone.outerHTML;
}
function bajar(nombre, contenido, tipo, auto=true){
  // algunos navegadores bloquean la descarga automática desde un archivo local:
  // se intenta, y además queda un link real para hacer clic a mano
  const url = URL.createObjectURL(new Blob([contenido],{type:tipo}));
  const a = document.createElement("a");
  a.href=url; a.download=nombre; a.textContent="⬇ Descargar "+nombre;
  a.className="btn"; a.style.cssText="display:inline-block;text-decoration:none;margin-top:10px";
  document.body.appendChild(a);
  if(auto){ try{ a.click(); }catch(e){} }
  const caja = $("#dlBox");
  if(caja){
    caja.innerHTML = "";
    caja.appendChild(a);
    caja.insertAdjacentHTML("beforeend",
      `<div class="hint" style="margin-top:8px">Si no se descargó solo, tocá el botón de arriba.
       También podés hacerle clic derecho → <i>Descargar archivo vinculado como…</i></div>`);
    a.style.margin="0";
  } else { setTimeout(()=>a.remove(), 60000); }
  setTimeout(()=>URL.revokeObjectURL(url), 120000);
}
function exportarPublico(){
  const f = fondo();
  openModal(`<h2>Actualizar la página del equipo</h2>
    <p class="hint" style="margin-top:0">Se va a publicar esto: <b>${S.jugadores.length} jugadores</b>,
      fondo <b>${money(f.saldo)}</b>, ${f.porCobrar>0? money(f.porCobrar)+" por cobrar" : "todo cobrado"},
      ${S.partidos.length} partido${S.partidos.length===1?"":"s"} cargado${S.partidos.length===1?"":"s"}.</p>
    <div class="card" style="background:var(--surface-2);margin-top:14px">
      <div style="font-weight:700;margin-bottom:6px">Paso 1 · Descargar</div>
      <div id="dlBox"></div>
    </div>
    <div class="card" style="background:var(--surface-2)">
      <div style="font-weight:700;margin-bottom:6px">Paso 2 · Subir</div>
      <div class="hint">Entrá a <b>app.netlify.com</b> → proyecto <b>westjan-fc</b> → pestaña <b>Deploys</b>
        → <i>browse files to upload</i> y elegí el archivo que acabás de bajar.<br>
        O mandámelo por el chat y lo subo yo.</div>
    </div>
    <div class="sticky-actions"><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>`);
  bajar("index.html", construirPublico(), "text/html;charset=utf-8", false);
}
function copiarDatos(){
  const t = JSON.stringify(S);
  navigator.clipboard?.writeText(t).then(
    ()=>toast("Datos copiados ("+Math.round(t.length/1024)+" KB) — pegalos en el chat"),
    ()=>toast("No se pudo copiar"));
}
function exportJSON(){
  bajar(S.club.replace(/\s+/g,"-").toLowerCase()+"-respaldo-"+hoy()+".json",
        JSON.stringify(S,null,2), "application/json");
}
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ S=Object.assign(structuredClone(DEF),JSON.parse(r.result)); closeModal(); render(); toast("Datos importados"); }
                 catch(e){ toast("Archivo inválido"); } };
  r.readAsText(f);
}
function exportCSV(){
  const rows=[["Apodo","PJ","Goles","Asistencias","Amarillas","Rojas","MVP","Asistencia %","Pagado","Debe"]];
  S.jugadores.forEach(j=>{const s=statsJugador(j); rows.push([j.nombre,s.pj,s.g,s.a,s.am,s.rj,s.mvp,s.asist,s.pagado,s.debe]);});
  rows.push([]); rows.push(["Fecha","Rival","GF","GC","Presentes","Recaudado","Cancha","Resultado"]);
  ordenados().forEach(p=>{const m=matchFin(p); rows.push([p.fecha,p.rival,+p.gf||0,+p.gc||0,m.n,m.cobrado,m.cancha,m.resultado]);});
  const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
  a.download=S.club.replace(/\s+/g,"-").toLowerCase()+"-datos.csv"; a.click(); toast("CSV descargado");
}
function wipe(){
  if(!confirm("¿Borrar TODOS los datos? No se puede deshacer.")) return;
  S=structuredClone(DEF); closeModal(); render(); toast("Todo borrado");
}

/* ---------- init ---------- */
try{ const t = LS && LS.getItem("westjan-tema"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}
S = load();
cargarLogo();
render();
</script>
